name: Build Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
      - name: Publish widget
        run: dotnet publish native/GpuMonitor.csproj -c Release -o native/publish
      - name: Restore GPU collector runtime
        shell: pwsh
        run: |
          gh release download v0.8.1 --repo "${{ github.repository }}" --pattern gputaskman-runtime.zip
          New-Item -ItemType Directory -Force src-tauri/resources/gputaskman | Out-Null
          Expand-Archive gputaskman-runtime.zip src-tauri/resources/gputaskman -Force
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer/gpu-monitor.nsi'
      - name: Create update manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $installer = "GPU-Monitor-$version-Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ version=$version; download_url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$installer"; sha256=$hash; release_notes="GPU monitoring, dashboard identity fixes, and automatic in-app updates." } | ConvertTo-Json | Set-Content update.json -Encoding utf8
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" "GPU-Monitor-$version-Setup.exe" update.json --title "GPU Monitor $version" --generate-notes
